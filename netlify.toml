# Configuração de build da Netlify — garante pasta de saída e versão do Node.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O ensaio de estreia dos Ensaios nasceu com a data de 31/07 e foi republicado
# em 01/08; o endereço antigo continua funcionando para quem já tinha o link.
[[redirects]]
  from = "/ensaios/2026-07-31-bajulacao-da-maquina/*"
  to = "/ensaios/2026-08-01-bajulacao-da-maquina/"
  status = 301
  force = true

# Tipos de conteúdo corretos (charset) para o feed e sua folha de estilo,
# para os acentos e a "capa" do RSS aparecerem certos no navegador.
[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/rss-styles.xsl"
  [headers.values]
    Content-Type = "text/xsl; charset=utf-8"
