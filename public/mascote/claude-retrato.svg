<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Retrato do Claude: uma figura de papel com bordas em âmbar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#28412f"/>
      <stop offset="100%" stop-color="#121d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c49a3a" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#c49a3a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c49a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#fbf4e1"/>
      <stop offset="100%" stop-color="#e4d5b2"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f7eed7"/>
      <stop offset="100%" stop-color="#ddcaa0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="fig">
      <ellipse cx="200" cy="150" rx="64" ry="74"/>
      <rect x="176" y="206" width="48" height="32"/>
      <path d="M56,400 C56,300 128,236 200,236 C272,236 344,300 344,400 Z"/>
    </clipPath>
  </defs>

  <!-- fundo -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- aura âmbar -->
  <ellipse cx="200" cy="166" rx="150" ry="158" fill="url(#glow)" filter="url(#soft)"/>

  <!-- folhas soltas flutuando -->
  <g opacity="0.9">
    <g transform="translate(312,150) rotate(13)">
      <rect x="-17" y="-24" width="34" height="48" rx="3" fill="url(#paper2)" stroke="#c49a3a" stroke-width="1.2" opacity="0.85"/>
      <line x1="-10" y1="-12" x2="10" y2="-12" stroke="#1d2b24" stroke-width="1.4" opacity="0.3"/>
      <line x1="-10" y1="-4" x2="6" y2="-4" stroke="#1d2b24" stroke-width="1.4" opacity="0.3"/>
      <line x1="-10" y1="4" x2="10" y2="4" stroke="#1d2b24" stroke-width="1.4" opacity="0.3"/>
    </g>
    <g transform="translate(86,242) rotate(-11)">
      <rect x="-15" y="-21" width="30" height="42" rx="3" fill="url(#paper2)" stroke="#c49a3a" stroke-width="1.1" opacity="0.8"/>
      <line x1="-9" y1="-9" x2="9" y2="-9" stroke="#1d2b24" stroke-width="1.3" opacity="0.28"/>
      <line x1="-9" y1="-1" x2="5" y2="-1" stroke="#1d2b24" stroke-width="1.3" opacity="0.28"/>
    </g>
  </g>

  <!-- figura: papel -->
  <g>
    <path d="M56,400 C56,300 128,236 200,236 C272,236 344,300 344,400 Z" fill="url(#paper)"/>
    <rect x="176" y="206" width="48" height="32" fill="url(#paper)"/>
    <ellipse cx="200" cy="150" rx="64" ry="74" fill="url(#paper)"/>
  </g>

  <!-- textura de folhas empilhadas (linhas finas), recortada na figura -->
  <g clip-path="url(#fig)" stroke="#cdbc92" stroke-width="2" opacity="0.45">
    <line x1="0" y1="92" x2="400" y2="92"/>
    <line x1="0" y1="108" x2="400" y2="108"/>
    <line x1="0" y1="124" x2="400" y2="124"/>
    <line x1="0" y1="188" x2="400" y2="188"/>
    <line x1="0" y1="204" x2="400" y2="204"/>
    <line x1="0" y1="258" x2="400" y2="258"/>
    <line x1="0" y1="288" x2="400" y2="288"/>
    <line x1="0" y1="318" x2="400" y2="318"/>
    <line x1="0" y1="348" x2="400" y2="348"/>
    <line x1="0" y1="378" x2="400" y2="378"/>
  </g>

  <!-- "rosto" composto de linhas de texto -->
  <g stroke="#1d2b24" opacity="0.34" stroke-linecap="round">
    <line x1="172" y1="138" x2="226" y2="138" stroke-width="2.6"/>
    <line x1="172" y1="151" x2="214" y2="151" stroke-width="2.6"/>
    <line x1="172" y1="164" x2="228" y2="164" stroke-width="2.6"/>
    <line x1="183" y1="180" x2="217" y2="180" stroke-width="2.2" opacity="0.7"/>
  </g>

  <!-- borda em âmbar (a luz que vaza pelas folhas) -->
  <g fill="none" stroke="#c49a3a" stroke-width="2.4" opacity="0.7" stroke-linejoin="round">
    <path d="M56,400 C56,300 128,236 200,236 C272,236 344,300 344,400"/>
    <ellipse cx="200" cy="150" rx="64" ry="74"/>
  </g>

  <!-- faísca âmbar (o ponto de atenção) -->
  <g transform="translate(217,132)">
    <path d="M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2 Z" fill="#e7b94a"/>
    <circle cx="0" cy="0" r="1.6" fill="#fff4d8"/>
  </g>
</svg>
