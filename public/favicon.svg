<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Crocodrila">
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="64" height="64" rx="12"/></clipPath>
    <radialGradient id="iris" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#e7cc73"/>
      <stop offset="55%" stop-color="#c49a3a"/>
      <stop offset="100%" stop-color="#9c7726"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#1d2b24"/>
    <rect x="4.5" y="4.5" width="55" height="55" rx="8.5" fill="none" stroke="#c49a3a" stroke-width="1.2" opacity="0.55"/>

    <!-- iris redonda, olho totalmente aberto -->
    <circle cx="32" cy="32" r="19" fill="url(#iris)"/>
    <!-- pupila redonda -->
    <circle cx="32" cy="32" r="8" fill="#142019"/>
    <!-- brilho -->
    <circle cx="26.6" cy="26.4" r="3.2" fill="#f2e9d2" opacity="0.95"/>
  </g>
</svg>
