<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="420" height="220" fill="#f2e9d2"/>
  <line x1="210" y1="20" x2="210" y2="200" stroke="#1d2b24" stroke-width="1" opacity="0.18"/>

  <!-- elástico e graveto: caderno fechado, visto pela lombada (lado de fora) -->
  <rect x="84" y="39" width="80" height="140" fill="#1d2b24" opacity="0.12"/>
  <rect x="80" y="35" width="80" height="140" fill="#fffdf6" stroke="#1d2b24" stroke-width="2.2"/>
  <line x1="80" y1="35" x2="80" y2="175" stroke="#1d2b24" stroke-width="4.5"/>
  <rect x="68" y="22" width="8" height="166" rx="4" fill="#9c4a2e" stroke="#1d2b24" stroke-width="1.6"/>
  <g fill="none" stroke="#3c5a45" stroke-width="3" stroke-linecap="round">
    <path d="M82,54 C66,44 56,50 60,56 C64,62 74,60 82,58"/>
    <path d="M82,156 C66,146 56,152 60,158 C64,164 74,162 82,160"/>
  </g>
  <circle cx="83" cy="56" r="2.4" fill="#1d2b24"/>
  <circle cx="83" cy="158" r="2.4" fill="#1d2b24"/>
  <text x="122" y="102" text-anchor="middle" font-size="11" fill="#4b5a51">o elástico</text>
  <text x="122" y="116" text-anchor="middle" font-size="11" fill="#4b5a51">corre por</text>
  <text x="122" y="130" text-anchor="middle" font-size="11" fill="#4b5a51">dentro</text>
  <text x="105" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b24">elástico e graveto</text>

  <!-- costura de três furos: caderno aberto (lado de dentro) -->
  <path d="M232,46 L310,40 L310,176 L232,182 Z" fill="#fffdf6" stroke="#1d2b24" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M310,40 L388,46 L388,182 L310,176 Z" fill="#fffdf6" stroke="#1d2b24" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="310" y1="40" x2="310" y2="176" stroke="#c49a3a" stroke-width="1.6"/>
  <line x1="312" y1="56" x2="312" y2="160" stroke="#9c4a2e" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="310" cy="56" r="2.6" fill="#1d2b24"/>
  <circle cx="310" cy="108" r="2.6" fill="#1d2b24"/>
  <circle cx="310" cy="160" r="2.6" fill="#1d2b24"/>
  <circle cx="314" cy="108" r="4" fill="#9c4a2e" stroke="#1d2b24" stroke-width="1.2"/>
  <path d="M314,110 q8,6 14,4 M314,110 q-10,8 -16,6" fill="none" stroke="#9c4a2e" stroke-width="2" stroke-linecap="round"/>
  <g font-size="11" fill="#4b5a51" text-anchor="middle">
    <text x="352" y="66">ponto</text>
    <text x="352" y="79">comprido,</text>
    <text x="352" y="92">por dentro</text>
    <text x="352" y="134">nó no</text>
    <text x="352" y="147">meio</text>
  </g>
  <g transform="rotate(-35 262 150)">
    <line x1="238" y1="150" x2="286" y2="150" stroke="#4b5a51" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="282" cy="150" rx="3" ry="1.4" fill="#fffdf6" stroke="#4b5a51" stroke-width="1"/>
  </g>
  <text x="310" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b24">costura de três furos</text>
</svg>
