<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c49a3a"/>
    </marker>
  </defs>
  <rect width="420" height="220" fill="#f2e9d2"/>
  <!-- tira dobrada no comprimento, vista de frente; a fenda abre como uma boca -->
  <path d="M40,110 L95,110 L135,62 L175,110 L230,110 L230,170 L40,170 Z" fill="#fffdf6" stroke="#1d2b24" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M95,110 L135,150 L175,110" fill="#e6dcc1" stroke="#1d2b24" stroke-width="2.2" stroke-linejoin="round"/>
  <g stroke="#3c5a45" stroke-width="2" stroke-dasharray="7 5">
    <line x1="88" y1="110" x2="88" y2="170"/>
    <line x1="182" y1="110" x2="182" y2="170"/>
  </g>
  <line x1="6" y1="140" x2="32" y2="140" stroke="#c49a3a" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="264" y1="140" x2="238" y2="140" stroke="#c49a3a" stroke-width="3" marker-end="url(#seta)"/>
  <text x="135" y="44" text-anchor="middle" font-size="12" fill="#4b5a51">a fenda abre</text>
  <!-- resultado -->
  <line x1="276" y1="112" x2="312" y2="112" stroke="#c49a3a" stroke-width="3" marker-end="url(#seta)"/>
  <rect x="332" y="66" width="56" height="80" fill="#1d2b24" opacity="0.12"/>
  <rect x="330" y="64" width="56" height="80" fill="#fffdf6" stroke="#1d2b24" stroke-width="2.2"/>
  <line x1="330" y1="64" x2="330" y2="144" stroke="#1d2b24" stroke-width="4.5"/>
  <text x="358" y="98" text-anchor="middle" font-size="11" fill="#4b5a51">8</text>
  <text x="358" y="112" text-anchor="middle" font-size="11" fill="#4b5a51">páginas</text>
  <text x="210" y="208" text-anchor="middle" font-size="12" fill="#4b5a51">empurre as pontas para o meio e feche o livrinho</text>
  <circle cx="24" cy="24" r="14" fill="#c49a3a" stroke="#1d2b24" stroke-width="1.6"/>
  <text x="24" y="29.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2b24">5</text>
</svg>
